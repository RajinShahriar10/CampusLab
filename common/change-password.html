<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Change Password | CampusLab</title>
	<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

	<div class="container">

		<div class="sidebar">
			<h1>CampusLab</h1>
			<p>User Portal</p>

			<ul>
				<li><a href="../admin/dashboard.html">Back to Dashboard</a></li>
				<li><a href="profile.html">My Profile</a></li>
				<li><a href="profile-edit.html">Edit Profile</a></li>
				<li><a class="active" href="change-password.html">Change Password</a></li>
			</ul>
		</div>

		<div class="main-content change-password">
			<h2 class="page-title">Change Password</h2>

			<form id="change-password-form" action="#" method="post" onsubmit="return validateChangePassword(this)" novalidate>
				<fieldset>
					<legend>Security Credentials</legend>

					<label for="current-password">Current Password:</label>
					<input type="password" id="current-password" name="current_password" placeholder="Enter current password" required />
					<br />
					<span class="error" id="current-password-error"></span>

					<label for="new-password">New Password:</label>
					<input type="password" id="new-password" name="new_password" placeholder="8+ chars with letter &amp; number" onkeyup="checkNewPasswordStrength()" required />
					<br />
					<small id="password-strength-indicator"></small>
					<br />
					<span class="error" id="new-password-error"></span>

					<label for="confirm-new-password">Confirm New Password:</label>
					<input type="password" id="confirm-new-password" name="confirm_new_password" placeholder="Re-enter new password" required />
					<br />
					<span class="error" id="confirm-new-password-error"></span>

					<input type="submit" value="Update Password" />
					<span class="success" id="change-password-success"></span>
				</fieldset>
			</form>
		</div>

	</div>

	<script src="../assets/js/validation.js"></script>
	<script src="../assets/js/admin.js"></script>
</body>
</html>
