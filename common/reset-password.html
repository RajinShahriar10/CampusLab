<!DOCTYPE html>
<html lang="en">
<head>
	<title>Reset Password | CampusLab</title>
	<link rel="stylesheet" href="../assets/css/passwordstyle.css">
</head>
<body>
	<div class="app-layout">
		<div class="sidebar">
			<h1>CampusLab</h1>
			<p>Laboratory and Equipment Reservation System</p>
			<ul>
				<li><a href="login.html">Login</a></li>
				<li><a href="register.html">Register</a></li>
				<li><a href="forgot-password.html">Forgot Password</a></li>
				<li><a href="../index.html">Back to Index</a></li>
			</ul>
		</div>
		<div class="main-content">
			<h2>Reset Your Password</h2>
			<p>Enter and confirm your new password.</p>
			<form action="#" method="post">
				<fieldset>
					<legend>New Password</legend>
					<input type="hidden" id="reset-token" name="reset_token" value="" />
					<label for="new-password">New Password:</label>
					<input type="password" id="new-password" name="new_password" placeholder="Enter your new password" minlength="8" required />
					<br />
					<label for="confirm-password">Confirm Password:</label>
					<input type="password" id="confirm-password" name="confirm_password" placeholder="Enter your new password again" minlength="8" required />
					<br />
					<button type="submit">Reset Password</button>
				</fieldset>
			</form>
			<p><a href="forgot-password.html">Back to Forgot Password</a></p>
		</div>
	</div>
	<script src="../assets/js/reset-password.js"></script>
</body>
</html>
