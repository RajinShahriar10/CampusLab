<!DOCTYPE html>
<html lang="en">
<head>
	
	<title>Forgot Password | CampusLab</title>
	<link rel="stylesheet" href="../assets/css/passwordstyle.css">
</head>
<body>
	<div class="app-layout">
		<div class="sidebar">
			<h1>CampusLab</h1>
			<p>Laboratory and Equipment Reservation System</p>
			<ul>
				<li><a href="login.html">Login</a></li>
				<li><a href="register.html">Register</a></li>
				<li><a href="reset-password.html">Reset Password</a></li>
				<li><a href="../index.html">Back to Index</a></li>
			</ul>
		</div>
		<div class="main-content">
			<h2>Forgot Your Password?</h2>
			<p>Enter your registered email address or student ID to request a password reset.</p>
			<form action="#" method="post">
				<fieldset>
					<legend>Account Information</legend>
					<label for="email-or-student-id">Email / Student ID:</label>
					<input type="text" id="email-or-student-id" name="email_or_student_id" placeholder="Enter your email or student ID" required />
					<br />
					<button type="submit">Request Password Reset</button>
				</fieldset>
			</form>
			<p><a href="login.html">Back to Login</a></p>
		</div>
	</div>
	<script src="../assets/js/forgot-password.js"></script>
</body>
</html>
