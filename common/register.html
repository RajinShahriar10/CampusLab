<!DOCTYPE html>
<html lang="en">
<head>
	<title>Register</title>
	<link rel="stylesheet" href="../assets/css/style.css">

</head>
<body>
	<div class="app-layout">
		<div class="sidebar">

			<h1>CampusLab</h1>
			<p>Laboratory and Equipment Reservation System</p>

			<ul>
				<li><a href="login.html" >Login</a></li>
				<li><a href="register.html">Register</a></li>
				<li><a href="forgot-password.html">Forgot Password</a></li>
				<li><a href="../index.html" >Back to Index</a></li>
			</ul>
		</div>

		<div class="main-content">
			<h2>Account Creation Form</h2> 

			<form action="#" method="post" enctype="multipart/form-data">
				<fieldset>
					<legend>Personal Details</legend>
					<label for="full-name">Full Name:</label>
					<input type="text" id="full-name" name="full_name" placeholder="Enter your full name" minlength="3" required />
					<br>
					<label for="student-id">Student / Staff ID:</label>
					<input type="text" id="student-id" name="student_id" placeholder="e.g. 24-57561-2" pattern="[0-9]{2}-[0-9]{5}-[0-9]" required />
					<br>
					<label for="email">Email:</label>
					<input type="email" id="email" name="email" placeholder="Enter your email" required />
					<br>
					<label for="phone">Phone:</label>
					<input type="tel" id="phone" name="phone" placeholder="01XXXXXXXXX" pattern="01[0-9]{9}" />
					<br>
					<label for="department">Department:</label>
					<select id="department" name="department" required>
						<option value="">Select your department</option>
						<option value="computer_science">Computer Science</option>
						<option value="eee">Electrical and Electronic Engineering</option>
						<option value="bba">Business Administration</option>
						<option value="english">English</option>
					</select>
					<br>
					<label for="role">Role:</label>
					<select id="role" name="role" required>
						<option value="">Select your role</option>
						<option value="student">Student</option>
						<option value="lab_technician">Lab Technician</option>
						<option value="lab_incharge">Lab In-Charge</option>
					</select>
					<br>
				</fieldset>
				
				<br>

				 <fieldset>
					<legend>Password</legend>
					<label for="password">Password:</label>
					<input type="password" id="password" name="password" placeholder="Enter your password" minlength="8" required />
					<br>
					<label for="confirm-password">Confirm password:</label>
					<input type="password" id="confirm-password" name="confirm_password" placeholder="Enter your password again" minlength="8" required />
					<br>
				</fieldset>
				<br>
			<label for="profile-picture">Profile Picture:</label>
			<input type="file" id="profile-picture" name="profile_picture" accept="image/*" />
			<br>
			<input type="checkbox" id="agree-terms" name="agree_terms" required /> Agree to the lab usage Terms &amp; Conditions
			<br>
			<br>
			<input type="submit" value="Create Your Account" />
			<input type="reset" />
			</form>
			<p>Already have an account? <a href="login.html">Login</a></p>
	</div>
	</div>
	<script src="../assets/js/common-data.js"></script>
	<script src="../assets/js/register.js"></script>
</body>
</html>
