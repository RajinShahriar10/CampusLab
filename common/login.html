<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Login</title>
	<link rel="stylesheet" href="../assets/css/style.css">

</head>
<body>
	<div class="app-layout">
		<div class="sidebar">
			<h1>CampusLab</h1>
			<p>Laboratory and Equipment Reservation System</p>
			<ul>
				<li><a href="login.html">Login</a></li>
				<li><a href="register.html">Register</a></li>
				<li><a href="forgot-password.html">Forgot Password</a></li>
				<li><a href="../index.html">Back to Index</a></li>
			</ul>
		</div>
		<div class="main-content">
			<h2>Login</h2>
			<form action="#" method="post">
				<fieldset>
					<legend>Login</legend>
					<label for="login-id">Email / Student ID:</label>
					<input type="text" id="login-id" name="login_id" placeholder="Enter your email or student ID" required />
					<br />
					<label for="password">Password:</label>
					<input type="password" id="password" name="password" placeholder="Enter your password" minlength="8" required />
					<br />
					<input type="checkbox" id="remember-me" name="remember_me" /> Remember me
					<br />
				</fieldset>
				<br />
				<input type="submit" value="Login" />
			</form>
			<p>New user? <a href="register.html">Register</a></p>
			<p><a href="forgot-password.html">Forgot Password?</a></p>
		</div>
	</div>
</body>
</html>
